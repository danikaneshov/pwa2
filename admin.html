<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>CRM | dám dym</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #121212; color: white; margin: 0; padding: 20px; }

        #login-screen { position: fixed; inset: 0; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        .login-input { padding: 15px; font-size: 1.2rem; text-align: center; border: 3px solid #00e5ff; background: #1e1e1e; color: white; border-radius: 8px; margin-bottom: 15px; outline: none; font-family: 'Montserrat', sans-serif; font-weight: 800;}
        .login-btn { padding: 15px 30px; font-weight: 900; background: #e60023; color: white; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-family: 'Montserrat', sans-serif;}

        header { border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-family: 'Permanent Marker', cursive; color: #00e5ff; margin: 0; font-size: 2rem; }
        
        .dashboard { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px; }
        .analytics { display: flex; gap: 10px; }
        .stat-box { flex: 1; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 2px solid #333; text-align: center; }
        .stat-num { font-family: 'Permanent Marker', cursive; font-size: 1.8rem; color: #e60023; }
        .stat-label { font-size: 0.75rem; color: #aaa; text-transform: uppercase; font-weight: 800; margin-top: 5px; }
        
        .chart-container { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 2px solid #333; height: 250px; }

        .order-card { background: white; color: #121212; padding: 15px; margin-bottom: 15px; border-radius: 12px; border-left: 8px solid #00e5ff; }
        .order-card.status-new { border-left-color: #e60023; }
        .order-card.status-done { opacity: 0.6; border-left-color: #4caf50; }
        .order-card.status-canceled { opacity: 0.5; border-left-color: #555; }

        .o-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 900; border-bottom: 2px dashed #ccc; padding-bottom: 10px;}
        .o-tariff { font-family: 'Permanent Marker', cursive; font-size: 1.5rem; }
        .o-details { font-size: 0.9rem; line-height: 1.5; margin-bottom: 15px; font-weight: 700;}
        .o-details span { color: #e60023; }
        .bowl-item { background: #eee; padding: 8px; border-radius: 6px; margin-bottom: 5px; font-size: 0.85rem;}

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .btn { padding: 10px; font-family: 'Montserrat', sans-serif; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        .b-accept { background: #ff9800; color: black; }
        .b-wa { background: #25D366; color: white; }
        .b-assembly { background: #333; color: white; }
        .b-courier { background: #00e5ff; color: black; }
        .b-done { background: #4caf50; color: white; grid-column: span 2; }
        .b-cancel { background: transparent; color: #e60023; border: 2px solid #e60023; grid-column: span 2; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="margin-bottom: 20px; font-family: 'Montserrat', sans-serif; font-weight: 900;">DÁM DYM CRM</h1>
        <input type="password" id="crm-pass" class="login-input" placeholder="Пароль">
        <button class="login-btn" onclick="checkPassword()">ВОЙТИ</button>
    </div>

    <div id="main-ui" style="display: none;">
        <header>
            <h1>DASHBOARD</h1>
        </header>

        <div class="dashboard">
            <div class="analytics">
                <div class="stat-box"><div class="stat-num" id="stat-count">0</div><div class="stat-label">Всего заказов</div></div>
                <div class="stat-box"><div class="stat-num" id="stat-revenue">0 ₸</div><div class="stat-label">Выручка</div></div>
            </div>
            <div class="chart-container">
                <canvas id="salesChart"></canvas>
            </div>
        </div>

        <h2 style="font-size: 1.2rem; margin-bottom: 15px; font-weight: 900;">ПОТОК ЗАКАЗОВ</h2>
        <div id="orders-container"><p style="text-align:center; font-weight: 800;">Загрузка базы...</p></div>
    </div>

    <script type="module">
        if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(r => r.forEach(x => x.unregister())); }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAk8sJuPI1N4EL1hD3CisVRoEs4nmudvP0", authDomain: "damdymdb.firebaseapp.com",
            projectId: "damdymdb", storageBucket: "damdymdb.firebasestorage.app",
            messagingSenderId: "43924470905", appId: "1:43924470905:web:0310c5298da38d7f56a8a8"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkPassword = function() {
            if(document.getElementById('crm-pass').value === 'anesh123' || sessionStorage.getItem('crm_auth') === 'true') {
                sessionStorage.setItem('crm_auth', 'true');
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
            } else { alert("Неверный пароль!"); }
        };

        if(sessionStorage.getItem('crm_auth') === 'true') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-ui').style.display = 'block';
        }

        const ctx = document.getElementById('salesChart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Выручка (₸)', data: [], backgroundColor: '#00e5ff', borderRadius: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#333' } }, x: { grid: { display: false } } } }
        });

        window.updateStatus = async function(orderId, newStatus, userPhone, price) {
            try {
                if (newStatus === 'done') {
                    const userRef = doc(db, "users", userPhone);
                    const userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        const currentSpent = userSnap.data().totalSpent || 0;
                        await updateDoc(userRef, { totalSpent: currentSpent + Number(price) });
                    }
                }
                await updateDoc(doc(db, "orders", orderId), { status: newStatus });
            } catch(e) { alert("Ошибка обновления!"); }
        };

        const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';
            
            let totalOrders = 0;
            let totalRevenue = 0;
            let salesByDay = {}; 

            const orders = [];
            snapshot.forEach((docSnap) => {
                const order = docSnap.data(); order.id = docSnap.id; orders.push(order);

                if(order.status === 'done') {
                    totalOrders++; totalRevenue += Number(order.price) || 0;
                    const dateStr = new Date(order.createdAt).toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'});
                    salesByDay[dateStr] = (salesByDay[dateStr] || 0) + Number(order.price);
                }
            });

            chart.data.labels = Object.keys(salesByDay).reverse();
            chart.data.datasets[0].data = Object.values(salesByDay).reverse();
            chart.update();

            document.getElementById('stat-count').innerText = totalOrders;
            document.getElementById('stat-revenue').innerText = totalRevenue.toLocaleString() + ' ₸';

            orders.forEach(order => {
                const d = new Date(order.createdAt);
                const timeStr = `${d.getHours()}:${(d.getMinutes()<10?'0':'') + d.getMinutes()}`;
                const cleanPhone = order.phone.replace(/\D/g, '');
                
                let cardClass = '';
                if(order.status === 'new') cardClass = 'status-new';
                if(order.status === 'done') cardClass = 'status-done';
                if(order.status.includes('canceled')) cardClass = 'status-canceled';

                let bowlsHTML = '';
                if(order.bowls && order.bowls.length > 0) {
                    bowlsHTML = order.bowls.map((b, i) => `<div class="bowl-item"><b>Чаша ${i+1}:</b> ${b.strength}, ${b.flavor}, Лед: ${b.ice ? 'Да' : 'Нет'}</div>`).join('');
                }

                container.innerHTML += `
                    <div class="order-card ${cardClass}">
                        <div class="o-header"><span class="o-tariff">${order.tariff} (${order.price} ₸)</span><span>${timeStr}</span></div>
                        <div class="o-details">
                            Имя: <span>${order.name || 'Не указано'}</span><br>
                            Номер: <span>${order.phone}</span><br>
                            Адрес: <span>${order.comment}</span><br>
                            Статус: <b>${order.status.toUpperCase()}</b>
                            <div style="margin-top: 10px;">${bowlsHTML}</div>
                        </div>
                        ${!order.status.includes('done') && !order.status.includes('canceled') ? `
                        <div class="actions">
                            <button class="btn b-accept" onclick="updateStatus('${order.id}', 'accepted', '${order.phone}', ${order.price})">ПРИНЯТЬ</button>
                            <a href="https://wa.me/${cleanPhone}" target="_blank" style="text-decoration:none;"><button class="btn b-wa" style="width:100%">WHATSAPP</button></a>
                            <button class="btn b-assembly" onclick="updateStatus('${order.id}', 'assembly', '${order.phone}', ${order.price})">СБОРКА</button>
                            <button class="btn b-courier" onclick="updateStatus('${order.id}', 'courier', '${order.phone}', ${order.price})">КУРЬЕР</button>
                            <button class="btn b-done" onclick="updateStatus('${order.id}', 'done', '${order.phone}', ${order.price})">ВЫДАН (ЗАВЕРШИТЬ)</button>
                            <button class="btn b-cancel" onclick="if(confirm('Отменить?')) updateStatus('${order.id}', 'canceled_admin', '${order.phone}', ${order.price})">ОТМЕНИТЬ</button>
                        </div>` : ''}
                    </div>
                `;
            });
        });
    </script>
</body>
</html>

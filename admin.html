<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>CRM | VKASANIE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #ffffff; color: #000000; margin: 0; padding: 20px; text-transform: uppercase; }

        #login-screen { position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        .login-box { border: 4px solid #000; padding: 40px; box-shadow: 12px 12px 0 #000; background: #fff; text-align: center; }
        .login-input { padding: 15px; font-size: 1.2rem; text-align: center; border: 4px solid #000; background: #f4f4f4; color: #000; margin-bottom: 20px; outline: none; font-family: 'Montserrat', sans-serif; font-weight: 900; text-transform: uppercase; display: block; width: 100%;}
        .login-btn { padding: 15px 30px; font-weight: 900; background: #000; color: #fff; border: 4px solid #000; cursor: pointer; text-transform: uppercase; font-family: 'Montserrat', sans-serif; width: 100%; font-size: 1.2rem; transition: 0.1s;}
        .login-btn:active { transform: translate(4px, 4px); box-shadow: none; background: #fff; color: #000;}

        header { border-bottom: 6px solid #000; padding-bottom: 15px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-family: 'Permanent Marker', cursive; color: #000; margin: 0; font-size: 2.5rem; letter-spacing: 2px;}
        
        .dashboard { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 40px; }
        .analytics { display: flex; gap: 20px; }
        .stat-box { flex: 1; background: #fff; padding: 20px; border: 4px solid #000; box-shadow: 6px 6px 0 #000; text-align: center; }
        .stat-num { font-family: 'Permanent Marker', cursive; font-size: 2.5rem; color: #000; }
        .stat-label { font-size: 0.9rem; color: #000; text-transform: uppercase; font-weight: 900; margin-top: 10px; border-top: 2px dashed #000; padding-top: 10px;}
        
        .chart-container { background: #fff; padding: 20px; border: 4px solid #000; box-shadow: 6px 6px 0 #000; height: 300px; }

        .order-card { background: white; color: #000; padding: 20px; margin-bottom: 25px; border: 4px solid #000; box-shadow: 8px 8px 0 #000; transition: 0.2s;}
        .order-card.status-new { border-color: #000; box-shadow: 8px 8px 0 #000, inset 0 0 0 4px #000; }
        .order-card.status-done { opacity: 0.5; box-shadow: 4px 4px 0 #000; }
        .order-card.status-canceled { opacity: 0.3; border-style: dashed; box-shadow: none; }

        .o-header { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 900; border-bottom: 4px solid #000; padding-bottom: 10px;}
        .o-tariff { font-family: 'Permanent Marker', cursive; font-size: 1.8rem; }
        .o-details { font-size: 1rem; line-height: 1.6; margin-bottom: 20px; font-weight: 800;}
        .o-details span { color: #000; background: #eee; padding: 2px 6px; border: 1px solid #000;}
        .bowl-item { background: #fff; padding: 10px; border: 2px dashed #000; margin-bottom: 8px; font-size: 0.9rem; font-weight: 900;}

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px; font-family: 'Montserrat', sans-serif; font-weight: 900; border: 3px solid #000; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; background: #fff; color: #000; box-shadow: 3px 3px 0 #000; transition: 0.1s;}
        .btn:active { transform: translate(3px, 3px); box-shadow: none; }
        .b-accept { background: #000; color: #fff; }
        .b-wa { background: #000; color: #fff; }
        .b-assembly { background: #fff; color: #000; border-style: dashed;}
        .b-courier { background: #000; color: #fff; }
        .b-done { background: #000; color: #fff; grid-column: span 2; font-size: 1.1rem; padding: 15px;}
        .b-cancel { background: transparent; color: #000; border: 3px dashed #000; grid-column: span 2; box-shadow: none;}
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1 style="margin-bottom: 30px; font-family: 'Permanent Marker', cursive;">VKASANIE<br>PANEL</h1>
            <input type="password" id="crm-pass" class="login-input" placeholder="ПАРОЛЬ">
            <button class="login-btn" onclick="checkPassword()">ВОЙТИ</button>
        </div>
    </div>

    <div id="main-ui" style="display: none;">
        <header>
            <h1>VKASANIE™ DASHBOARD</h1>
        </header>

        <div class="dashboard">
            <div class="analytics">
                <div class="stat-box"><div class="stat-num" id="stat-count">0</div><div class="stat-label">ВСЕГО ЗАКАЗОВ</div></div>
                <div class="stat-box"><div class="stat-num" id="stat-revenue">0 ₸</div><div class="stat-label">ВЫРУЧКА</div></div>
            </div>
            <div class="chart-container">
                <canvas id="salesChart"></canvas>
            </div>
        </div>

        <h2 style="font-size: 1.5rem; margin-bottom: 20px; font-weight: 900; border-bottom: 4px solid #000; display: inline-block; padding-bottom: 5px;">ПОТОК ЗАКАЗОВ</h2>
        <div id="orders-container"><p style="text-align:center; font-weight: 900; font-size: 1.2rem; border: 4px dashed #000; padding: 30px;">ЗАГРУЗКА БАЗЫ...</p></div>
    </div>

    <script type="module">
        if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(r => r.forEach(x => x.unregister())); }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAk8sJuPI1N4EL1hD3CisVRoEs4nmudvP0", authDomain: "damdymdb.firebaseapp.com",
            projectId: "damdymdb", storageBucket: "damdymdb.firebasestorage.app",
            messagingSenderId: "43924470905", appId: "1:43924470905:web:0310c5298da38d7f56a8a8"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkPassword = function() {
            if(document.getElementById('crm-pass').value === 'anesh123' || sessionStorage.getItem('crm_auth') === 'true') {
                sessionStorage.setItem('crm_auth', 'true');
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
            } else { alert("НЕВЕРНЫЙ ПАРОЛЬ!"); }
        };

        if(sessionStorage.getItem('crm_auth') === 'true') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-ui').style.display = 'block';
        }

        const ctx = document.getElementById('salesChart').getContext('2d');
        Chart.defaults.font.family = "'Montserrat', sans-serif";
        Chart.defaults.font.weight = "900";
        Chart.defaults.color = "#000";
        let chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'ВЫРУЧКА (₸)', data: [], backgroundColor: '#000', borderWidth: 2, borderColor: '#000', borderRadius: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#ccc' } }, x: { grid: { display: false } } } }
        });

        window.updateStatus = async function(orderId, newStatus, userPhone, price) {
            try {
                if (newStatus === 'done') {
                    const userRef = doc(db, "users", userPhone);
                    const userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        const currentSpent = userSnap.data().totalSpent || 0;
                        await updateDoc(userRef, { totalSpent: currentSpent + Number(price) });
                    }
                }
                await updateDoc(doc(db, "orders", orderId), { status: newStatus });
            } catch(e) { alert("ОШИБКА ОБНОВЛЕНИЯ!"); }
        };

        const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';
            
            let totalOrders = 0;
            let totalRevenue = 0;
            let salesByDay = {}; 

            const orders = [];
            snapshot.forEach((docSnap) => {
                const order = docSnap.data(); order.id = docSnap.id; orders.push(order);

                if(order.status === 'done') {
                    totalOrders++; totalRevenue += Number(order.price) || 0;
                    const dateStr = new Date(order.createdAt).toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'});
                    salesByDay[dateStr] = (salesByDay[dateStr] || 0) + Number(order.price);
                }
            });

            chart.data.labels = Object.keys(salesByDay).reverse();
            chart.data.datasets[0].data = Object.values(salesByDay).reverse();
            chart.update();

            document.getElementById('stat-count').innerText = totalOrders;
            document.getElementById('stat-revenue').innerText = totalRevenue.toLocaleString() + ' ₸';

            orders.forEach(order => {
                const d = new Date(order.createdAt);
                const timeStr = `${d.getHours()}:${(d.getMinutes()<10?'0':'') + d.getMinutes()}`;
                const cleanPhone = order.phone.replace(/\D/g, '');
                
                let cardClass = '';
                if(order.status === 'new') cardClass = 'status-new';
                if(order.status === 'done') cardClass = 'status-done';
                if(order.status.includes('canceled')) cardClass = 'status-canceled';

                let bowlsHTML = '';
                if(order.bowls && order.bowls.length > 0) {
                    bowlsHTML = order.bowls.map((b, i) => `<div class="bowl-item">ЧАША ${i+1}: ${b.strength} | ${b.flavor} | ЛЕД: ${b.ice ? 'ДА' : 'НЕТ'}</div>`).join('');
                }

                container.innerHTML += `
                    <div class="order-card ${cardClass}">
                        <div class="o-header"><span class="o-tariff">${order.tariff} (${order.price} ₸)</span><span>${timeStr}</span></div>
                        <div class="o-details">
                            ИМЯ: <span>${order.name || 'НЕ УКАЗАНО'}</span><br>
                            НОМЕР: <span>${order.phone}</span><br>
                            АДРЕС: <span>${order.comment}</span><br>
                            СТАТУС: <span style="background:#000; color:#fff; padding: 4px 8px;">${order.status.toUpperCase()}</span>
                            <div style="margin-top: 15px;">${bowlsHTML}</div>
                        </div>
                        ${!order.status.includes('done') && !order.status.includes('canceled') ? `
                        <div class="actions">
                            <button class="btn b-accept" onclick="updateStatus('${order.id}', 'accepted', '${order.phone}', ${order.price})">ПРИНЯТЬ</button>
                            <a href="https://wa.me/${cleanPhone}" target="_blank" style="text-decoration:none;"><button class="btn b-wa" style="width:100%">WHATSAPP</button></a>
                            <button class="btn b-assembly" onclick="updateStatus('${order.id}', 'assembly', '${order.phone}', ${order.price})">СБОРКА</button>
                            <button class="btn b-courier" onclick="updateStatus('${order.id}', 'courier', '${order.phone}', ${order.price})">КУРЬЕР</button>
                            <button class="btn b-done" onclick="updateStatus('${order.id}', 'done', '${order.phone}', ${order.price})">ВЫДАН</button>
                            <button class="btn b-cancel" onclick="if(confirm('ТОЧНО ОТМЕНИТЬ?')) updateStatus('${order.id}', 'canceled_admin', '${order.phone}', ${order.price})">ОТМЕНИТЬ</button>
                        </div>` : ''}
                    </div>
                `;
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>dám dym APP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dirty: #f4f2ed; --black: #121212; --red: #e60023; --cyan: #00e5ff; --font-body: 'Montserrat', sans-serif; --font-vandal: 'Permanent Marker', cursive; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font-body); background-color: var(--bg-dirty); color: var(--black); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; font-family: var(--font-body); font-weight: 900; text-transform: uppercase; padding: 18px 20px; background: var(--cyan); color: var(--black); border: 3px solid var(--black); border-radius: 12px; box-shadow: 0px 4px 0px var(--black); font-size: 1.1rem; cursor: pointer; transition: 0.1s;}
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--black); }
        .btn-red { background: var(--red); color: white; }
        .btn-black { background: var(--black); color: white; }
        .btn-outline { background: transparent; color: var(--red); border-color: var(--red); box-shadow: none; margin-top: 15px; }

        header { padding: 15px 5vw; display: flex; justify-content: space-between; align-items: center; background: white; border-bottom: 2px solid rgba(0,0,0,0.1); padding-top: calc(15px + env(safe-area-inset-top)); }
        .logo { font-family: var(--font-vandal); font-size: 2rem; color: var(--black); }
        .status-badge { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 0.8rem; background: var(--black); color: white; padding: 6px 12px; border-radius: 20px; }

        .app-content { flex-grow: 1; overflow-y: auto; padding: 20px 5vw 100px; -ms-overflow-style: none; scrollbar-width: none; }
        .app-content::-webkit-scrollbar { display: none; }
        .tab-pane { display: none; animation: fadeIn 0.2s ease-out; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .section-title { font-weight: 900; font-size: 1.8rem; text-transform: uppercase; margin-bottom: 20px; }
        
        .app-card { background: white; border: 3px solid var(--black); padding: 20px; margin-bottom: 20px; border-radius: 16px; box-shadow: 0px 6px 0px rgba(0,0,0,1); }
        .app-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .app-card-title { font-family: var(--font-vandal); font-size: 2.2rem; }
        .app-card-price { font-family: var(--font-body); font-weight: 900; font-size: 1.5rem; color: var(--red); text-align: right; }
        .app-card-desc { font-weight: 800; font-size: 1rem; margin-bottom: 8px; line-height: 1.3; }
        .app-card-kit { font-weight: 500; font-size: 0.85rem; color: #666; margin-bottom: 20px; line-height: 1.4; }
        
        .price-wrapper { display: flex; flex-direction: column; align-items: flex-end; }
        .old-price { font-family: var(--font-body); font-size: 1rem; color: #999; text-decoration: line-through; text-decoration-color: var(--black); font-weight: 900; display: none; }
        .discount-badge { font-family: var(--font-body); background: var(--cyan); color: var(--black); font-size: 0.75rem; padding: 3px 6px; border-radius: 4px; font-weight: 900; margin-bottom: 2px; display: none; text-transform: uppercase;}

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; display: none; justify-content: center; align-items: flex-end; }
        .modal-content { background: white; width: 100%; max-width: 600px; border-top: 4px solid var(--black); border-radius: 24px 24px 0 0; padding: 30px 5vw calc(30px + env(safe-area-inset-bottom)); animation: slideUp 0.3s ease-out; max-height: 90vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-title { font-weight: 900; font-size: 2rem; margin-bottom: 5px; text-transform: uppercase; }
        .modal-subtitle { font-family: var(--font-vandal); font-size: 1.5rem; color: var(--red); margin-bottom: 20px; }
        .modal-label { font-weight: 900; font-size: 0.9rem; margin-top: 25px; margin-bottom: 10px; display: block; color: #555; }
        
        .range-slider { width: 100%; appearance: none; height: 10px; background: #eee; border-radius: 5px; outline: none; margin-bottom: 10px; border: 2px solid var(--black); }
        .range-slider::-webkit-slider-thumb { appearance: none; width: 28px; height: 28px; background: var(--red); border: 3px solid var(--black); border-radius: 50%; cursor: pointer; }
        .strength-text { font-weight: 900; font-size: 1.2rem; text-align: center; margin-bottom: 10px; }
        
        .modal-input { width: 100%; padding: 15px; border: 3px solid var(--black); border-radius: 12px; background: #fafafa; font-family: var(--font-body); font-weight: 700; font-size: 1rem; margin-bottom: 15px; outline: none; }
        .ice-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .ice-btn { flex: 1; padding: 15px; border: 3px solid var(--black); border-radius: 12px; background: white; font-weight: 900; text-align: center; cursor: pointer; color: #888; }
        .ice-btn.active { background: var(--cyan); color: var(--black); border-color: var(--black); }

        .tracker-card { background: white; border: 3px solid var(--black); padding: 25px; border-radius: 16px; box-shadow: 0px 6px 0px rgba(0,0,0,1); display: none; text-align: center; }
        .tracker-status { font-weight: 900; font-size: 1.3rem; margin: 15px 0; background: #eee; padding: 15px; border-radius: 8px; border: 2px dashed #ccc;}
        
        .auth-box { background: white; border: 3px solid var(--black); padding: 30px 20px; border-radius: 16px; text-align: center; }
        .auth-switch { margin-top: 20px; font-weight: 800; color: var(--red); text-decoration: underline; cursor: pointer; }

        /* Прогресс бар лояльности */
        .loyalty-progress-bg { background: #333; height: 15px; border-radius: 10px; margin-top: 15px; overflow: hidden; border: 2px solid #555;}
        .loyalty-progress-fill { background: var(--cyan); height: 100%; width: 0%; transition: 0.5s; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 2px solid rgba(0,0,0,0.1); display: flex; justify-content: space-around; padding: 10px 0; padding-bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; width: 33%; color: #aaa; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; cursor: pointer; }
        .nav-icon { width: 28px; height: 28px; margin-bottom: 4px; fill: currentColor; }
        .nav-item.active { color: var(--red); }
    </style>
</head>
<body>

    <header>
        <div class="logo">dám dym</div>
        <div class="status-badge"><span class="pulse-dot"></span> 24/7</div>
    </header>

    <div class="app-content">
        <div id="tab-home" class="tab-pane active">
            <h2 class="section-title">ТВОЙ ДЫМ</h2>
            
            <div id="home-empty" style="text-align: center; padding: 50px 20px; background: white; border: 3px dashed #ccc; border-radius: 16px; font-weight: 800; color: #888;">
                <p>Выбери аппарат в Арсенале, и здесь появится статус твоего заказа.</p>
                <button class="btn btn-red" style="margin-top: 25px;" onclick="switchTab('tab-store')">В АРСЕНАЛ</button>
            </div>

            <div id="home-tracker" class="tracker-card">
                <div style="font-weight: 900; font-size: 1.2rem; color: var(--red); margin-bottom: 10px;">АКТИВНЫЙ ЗАКАЗ</div>
                <div style="font-family: var(--font-vandal); font-

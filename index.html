<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VKASANIE - Заказ и Чат</title>
  <style>
    /* ================= СТИЛИ БАЗЫ ================= */
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    /* ================= СТИЛИ ЧАТА ================= */
    .chat-container {
      background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%); 
      padding: 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .message.system {
      background: #ffffff;
      color: #333333;
      border-radius: 18px 18px 18px 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      border-left: 4px solid #8A2387; 
      padding: 12px 16px;
      max-width: 80%;
      align-self: flex-start;
    }

    .message.user {
      background: linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%);
      color: white;
      border-radius: 18px 18px 0 18px;
      box-shadow: 0 4px 10px rgba(255, 65, 108, 0.3);
      padding: 12px 16px;
      max-width: 80%;
      align-self: flex-end;
    }

    /* ================= СТИЛИ ЗАКАЗА ================= */
    .order-container {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .order-header {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      text-align: center;
    }

    .bowl-card {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      position: relative;
    }

    .bowl-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #1e293b;
    }

    .bowl-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bowl-inputs input, .bowl-inputs select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
    }

    /* Кнопка удаления (Крестик) */
    .btn-remove {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #fee2e2;
      color: #ef4444;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-remove:hover {
      background: #fca5a5;
      color: white;
    }

    .btn-add-bowl {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s;
    }

    .btn-add-bowl:hover {
      background: #059669;
    }

    .total-sum {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      color: #0f172a;
      border-top: 2px dashed #cbd5e1;
      padding-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container chat-container">
    <div class="message system">Привет! Я бот VKASANIE. Какой кальян предпочитаешь сегодня? 💨</div>
    <div class="message user">Хочу что-то легкое, без цитруса и холодка.</div>
    <div class="message system">Отличный выбор! Переходи к настройке забивки ниже 👇</div>
  </div>

  <div class="container order-container">
    <div class="order-header">Оформление заказа</div>
    
    <div id="bowlsList">
      <div class="bowl-card" id="base-bowl">
        <div class="bowl-title">Основная чаша</div>
        <div class="bowl-inputs">
          <label>Крепость (0-10): <input type="number" min="0" max="10" value="4"></label>
          <input type="text" placeholder="Вкусы (например: Малина, Клубника)" value="Ягоды">
          <select>
            <option value="no-ice">Без холодка</option>
            <option value="ice">С холодком</option>
          </select>
        </div>
      </div>
    </div>

    <button class="btn-add-bowl" onclick="addExtraBowl()">+ Добавить доп. чашу (2 000 ₸)</button>

    <div class="total-sum">Итого: <span id="totalPriceDisplay">5000</span> ₸</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
